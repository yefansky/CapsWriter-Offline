name: Build and publish CapsWriter Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release after the build succeeds
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: capswriter-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: v2.6.${{ github.run_number }}
      PYTHONUTF8: "1"

    steps:
      - name: Check out the exact commit to release
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-server.txt
            requirements-client.txt

      - name: Install build dependencies and llama runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-server.txt -r requirements-client.txt
          .\setup_llama_runtime.bat

      - name: Run unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Prepare immutable version metadata
        shell: pwsh
        run: python scripts\prepare_release.py --tag "$env:RELEASE_TAG" --repository "$env:GITHUB_REPOSITORY"

      - name: Build portable Windows executables
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean build.spec
          python -m PyInstaller --noconfirm --clean build-manager.spec
          python -m PyInstaller --noconfirm --clean build-update-helper.spec
          python scripts\verify_manager_bundle.py dist\start_manager.exe
          Copy-Item dist\start_manager.exe dist\CapsWriter-Offline\start_manager.exe -Force
          Copy-Item dist\CapsWriter-Update.exe dist\CapsWriter-Offline\CapsWriter-Update.exe -Force
          python scripts\smoke_manager_layout.py dist\CapsWriter-Offline\start_manager.exe

      - name: Build per-user Windows installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $compiler = Get-ChildItem 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $compiler) { throw 'Inno Setup compiler was not installed.' }
          & $compiler "/DAppVersion=$($env:RELEASE_TAG.TrimStart('v'))" "/DSourceDir=$PWD\dist\CapsWriter-Offline" "/DOutputDir=$PWD\release" installer\CapsWriter-Offline.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package portable ZIP and checksums
        shell: pwsh
        run: python scripts\package_release.py --tag "$env:RELEASE_TAG"

      - name: Retain build output for diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: CapsWriter-Offline-${{ env.RELEASE_TAG }}
          path: release\*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.publish == true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:RELEASE_TAG" release\* --target "$env:GITHUB_SHA" --title "CapsWriter Offline $env:RELEASE_TAG" --generate-notes --latest
